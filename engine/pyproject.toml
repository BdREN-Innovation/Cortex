[project]
name = "cortex-engine"
version = "0.1.0"
description = "Crawl a site, build a RAG knowledge base over it, and score the result."
requires-python = ">=3.12,<3.13"

# Only what the scaffold itself needs: PyYAML to read configs, numpy for the
# vector type hints. Everything else is yours to choose — add it with
# `uv add <package>` when you decide you need it. See the README.
dependencies = [
    "PyYAML>=6.0",
    "beautifulsoup4>=4.15.0",
    "crawl4ai>=0.9.3",
    "httpx>=0.28.1",
    "numpy>=1.26",
    "requests>=2.32",
    "cohere>=7.1.1",
    "google-genai>=2.23.0",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "pypdf>=6.18.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "voyageai>=0.5.0",
]

[project.optional-dependencies]
dev = ["black>=24.1", "flake8>=7.0", "pytest>=8.0"]
# Stage 4 (browser capture) only. Install with: uv sync --extra browser
browser = ["crawl4ai>=0.7.4"]
ocr = [
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
]

[project.scripts]
engine = "engine.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
# No data exclusion needed: the captured corpus lives at engine/corpus/,
# outside the package, so it is not a wheel input in the first place.

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
