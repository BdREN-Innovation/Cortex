[project]
name = "cortex-engine"
version = "0.1.0"
description = "Crawl a site, build a RAG knowledge base over it, and score the result."
requires-python = ">=3.12,<3.13"

# Only what the scaffold itself needs: PyYAML to read configs, numpy for the
# vector type hints. Everything else is yours to choose — add it with
# `uv add <package>` when you decide you need it. See the README.
dependencies = [
    "PyYAML>=6.0",
    "beautifulsoup4>=4.15.0",
    "numpy>=1.26",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.28.2",
    "pypdf>=6.18.0",
]

[project.optional-dependencies]
dev = ["black>=24.1", "flake8>=7.0"]

[project.scripts]
engine = "engine.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.black]
line-length = 100
