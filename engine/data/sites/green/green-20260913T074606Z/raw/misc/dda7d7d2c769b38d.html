<!-- Log In Section Start -->
<div class="login-section">
    <div class="materialContainer">
        <div class="box">
            <div class="login-title">
                <h2>Eduroam (GUB)</h2>
            </div>
            

            <br>
            <br>
            <br>

            <div class="button login">
                <button onclick="window.location.href='/registration/'">
                    <span>Get Account</span>
                    <i class="fa fa-check"></i>
                </button>
            </div>

            <div class="button login">
                <button onclick="window.location.href='/change-pass/'">
                    <span>Change Password</span>
                    <i class="fa fa-check"></i>
                </button>
            </div>
            <div class="button login">
                <button onclick="window.location.href='/reset/password/'">
                    <span>Reset Password</span>
                    <i class="fa fa-check"></i>
                </button>
            </div>
            <div class="button login">
                <button onclick="window.open('https://cat.eduroam.org/', '_blank')">
                    <span>Connection Support <span style="font-size: 10px; margin-top: 2px">(Click here to download installer, in case of connection issues with eduroam account)</span></span>
                    <i class="fa fa-check"></i>
                </button>
            </div>



        </div>

    </div>

</div>
