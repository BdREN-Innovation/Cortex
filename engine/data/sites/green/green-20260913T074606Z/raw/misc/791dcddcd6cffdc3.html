      radial-gradient(ellipse 60% 80% at 90% 80%, rgba(15,52,96,0.09) 0%, transparent 55%),

  .shape-2 {

  .shape-3 {

  .logo-block {

    position: relative;
    overflow: hidden;
  }

  .login-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--blue-deep), var(--blue-bright), var(--green-accent));

  .btn-microsoft:hover {
