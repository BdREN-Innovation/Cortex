                                        </div>
    
                                        <div class="form-group">
                                            <label for="amount">Amount</label>
                                            <input type="number" id="total_amount" class="form-control" name="amount" value="" placeholder="Amount" min="10" required="">

                                        <input type="hidden" name="cus_name" id="customer_name" val="">

                                        <input type="hidden" name="cus_email" id="email" val="">
                                        <input type="hidden" name="father_mobile_no" id="father_mobile_no" val="">
                                         
                                        <hr class="mb-4">
