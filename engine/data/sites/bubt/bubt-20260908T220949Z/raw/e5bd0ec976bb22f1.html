function validatePassword() {
    var username = document.getElementById("UserName").value.trim();
    var password = document.getElementById("PasWord").value.trim();
    var onlyNumbers = /^\d+$/.test(username); // Check if username contains only numbers


    /*if (employeeId(username)){
        errors.push("Employee login is temporarily disabled during the result publishing period.");
        alert("Employee login is temporarily disabled during the result publishing period.");
        return false;
    }*/



    // Check if username contains only digits, return true immediately
    if (onlyNumbers) {
        return true;
    }
    
    // Array to store error messages
    var errors = [];

    // Check if the password length is between 8 and 20 characters
    if (password.length < 8 || password.length > 20) {
        errors.push("Password must be between 8 and 20 characters long");
    }

    // Check if the password contains at least one uppercase letter
    if (!/[A-Z]/.test(password)) {
        errors.push("Password must contain at least one uppercase letter");
    }

    // Check if the password contains at least one lowercase letter
    if (!/[a-z]/.test(password)) {
        errors.push("Password must contain at least one lowercase letter");
    }

    // Check if the password contains at least one digit
    if (!/\d/.test(password)) {
        errors.push("Password must contain at least one digit");
    }

    // Check if the password contains at least one special character from the given list
    if (!/[~!@#$%&*_\=\+\.\?]/.test(password)) {
        errors.push("Password must contain at least one special character from the list: ~!@#$%&*_\=\+\.\?");
    }

    // Display a single alert with all error messages, if any
    if (errors.length > 0) {
        errors.push("\n\nPlease change password on DCAMPUS Software.");
        alert("Your password does not follow strong password policy. \n\nPlease change password on DCAMPUS Software.");
        
        //alert(errors.join("\n"));
        return false;
    }

    // If no errors, return true
    return true;
}
