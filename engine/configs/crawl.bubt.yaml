
# Crawl config for BUBT

site: bubt

seeds:
  - https://www.bubt.edu.bd/

allowed_domains:
  - bubt.edu.bd

include_patterns: []
exclude_patterns: []

# Larger crawl
max_depth: 5
max_pages: 100

assets:
  download_documents: true
  max_documents: 100

fetch:
  user_agent: "CortexEngine/0.1 (+https://github.com/BdREN-Innovation/Cortex)"
  delay_seconds: 1.5
  timeout_seconds: 20
  max_retries: 2
  max_bytes: 5000000
  max_asset_bytes: 20000000
  obey_robots: true
  concurrency: 3