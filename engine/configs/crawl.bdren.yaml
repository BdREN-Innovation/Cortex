# Crawl config for bdren.net.bd.

site: bdren

seeds:
  - https://bdren.net.bd/

allowed_domains:
  - bdren.net.bd

include_patterns: []

exclude_patterns: []

max_depth: 3
max_pages: 5

assets:
  download_documents: true
  max_documents: 5

fetch:
  user_agent: "CortexEngine/0.1 (+https://github.com/BdREN-Innovation/Cortex)"
  delay_seconds: 1.5
  timeout_seconds: 20
  max_retries: 2
  max_bytes: 5000000
  max_asset_bytes: 20000000
  obey_robots: true
  concurrency: 3