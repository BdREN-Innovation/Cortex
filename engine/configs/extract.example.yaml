# Copy to configs/extract.<site>.yaml. Run:
#   uv run engine extract --run data/sites/<site>/<run> --config configs/extract.<site>.yaml
#
# OWNED BY: Team B.
# READS:    a crawl run directory (Team A's output)
# WRITES:   documents.jsonl beside it
#
# This stage reads bytes Team A already captured. It never touches the network,
# so re-running it is free — tune, re-run, read the output, tune again. Use
# --out to write somewhere else and compare two settings side by side.
#
# The keys below are a starting shape, not a fixed schema. Add, rename or drop
# them as your design needs — just keep this file and ExtractConfig in step.

# Names one of the parsers you register in knowledge/parsers.py.
# Which parsers exist, and what they use, is your decision — see that file.
parser: ""

# Below this, a page is navigation rather than content. There is no correct
# value; find one by looking at what gets dropped.
min_text_chars: 200

# Whether to mirror a markdown copy of each table to tables/ for inspection.
# Tables are inlined into the document text either way — that is where they
# are useful. This is only the eyeball copy.
save_tables: true

# Per-site extraction overrides, for when the generic extractor gets a page
# wrong. Config rather than code, so nobody edits a shared module to fix one
# site and several people can tune several sites at once.
selectors:
  main: ""                          # e.g. "#article-body" — where content lives
  drop: []                          # e.g. [".cookie-banner", ".related"]
  breadcrumb: ""                    # e.g. ".crumbs"
