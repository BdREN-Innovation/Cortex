# Parser comparison A of B — the zero-dependency baseline.
#
#   uv run engine extract --run data/sites/<site>/<run> \
#     --config configs/extract.builtin.yaml --out builtin.jsonl
#
# pypdf: ~10 ms/page, ~15 MB resident, nothing to install. It gets the
# characters out of a PDF but flattens tables into whitespace-separated runs
# and interleaves multi-column pages.
#
# Run this AND extract.pdfplumber.yaml over the same crawl, then diff the two
# documents.jsonl files. Whichever wins is an empirical fact about your sites'
# PDFs, not a matter of taste. See src/engine/knowledge/README.md §5.

parser: builtin
min_text_chars: 200
save_tables: true
