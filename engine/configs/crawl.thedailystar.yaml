site: thedailystar

seeds:
  - https://www.thedailystar.net/

allowed_domains:
  - thedailystar.net

include_patterns: []

exclude_patterns:
  - "/user"
  - "/login"
  - "/register"
  - "/search"
  - "/newsletter"
  - "/subscription"

max_depth: 5
max_pages: 200

assets:
  download_documents: true
  max_documents: 50

fetch:
  user_agent: "CortexEngine/0.1 (+https://github.com/BdREN-Innovation/Cortex)"
  delay_seconds: 1.5
  timeout_seconds: 25
  max_retries: 2
  max_bytes: 5000000
  max_asset_bytes: 20000000
  obey_robots: true
  concurrency: 3
