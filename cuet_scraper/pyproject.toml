[project]
name = "cuet-scraper"
version = "0.1.0"
description = "Capture the CUET public website: API-first, browser only where the API does not reach."
requires-python = ">=3.12,<3.13"

# requests is the primary dependency: stages 1, 2, 5 and 6 are HTTP + JSON only.
# crawl4ai is deliberately an EXTRA, not a core dependency — see below.
dependencies = [
    "requests>=2.32",
    "cortex-engine",
]

[project.optional-dependencies]
# Stage 4 (capture) only. `uv sync --extra browser` then `uv run crawl4ai-setup`.
#
# Kept out of the core dependencies on purpose. Four of the six stages need no
# browser, and a failed Chromium install must not block them — see spec §5,
# "Repository placement". It also keeps a ~400 MB download away from anyone who
# only wants to re-run extraction over an existing capture.
browser = ["crawl4ai>=0.7.4"]
dev = ["pytest>=8.0", "black>=24.1", "flake8>=7.0"]

[project.scripts]
cuet-scraper = "cuet_scraper.__main__:main"

# The engine lives beside us in this repo. We depend on it for ONE thing:
# engine.contracts, which defines CrawledPage / CleanDocument / make_doc_id.
# Importing them beats copying them — spec §12.1.
[tool.uv.sources]
cortex-engine = { path = "../engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuet_scraper"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
